# Builds and publishes a GitHub release when a version tag is pushed:
#
#   git tag v0.3.0
#   git push origin v0.3.0
#
# The tag must match <Version> in src/Directory.Build.props. The release notes are that version's section of CHANGELOG.md.
# The zips keep the same names in every release, so .../releases/latest/download/GameShare-LanParty.zip always gets the newest.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check the tag, the version and the public key
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in src/Directory.Build.props." }
          # Without the key the builds would go out with verified games off, better to stop here than to find out at the LAN party.
          if (-not (Test-Path scripts/trust-public.key)) { throw "scripts/trust-public.key is not in the repository." }
          # Without these no PC would ever update itself to this version. The public key is built into the programs,
          # the private one signs the update packages; package-release.ps1 checks that the two belong together.
          if (-not (Test-Path scripts/release-public.key)) { throw "scripts/release-public.key is not in the repository. Make it with gameshare-admin release-keygen." }
          if (-not $env:GAMESHARE_RELEASE_KEY) { throw "The secret GAMESHARE_RELEASE_KEY is not set: Settings, Secrets and variables, Actions." }
          "VERSION=$version" >> $env:GITHUB_ENV
        env:
          GAMESHARE_RELEASE_KEY: ${{ secrets.GAMESHARE_RELEASE_KEY }}

      - name: Build
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Pack
        shell: pwsh
        run: ./scripts/package-release.ps1
        env:
          GAMESHARE_RELEASE_KEY: ${{ secrets.GAMESHARE_RELEASE_KEY }}

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are this version's section of CHANGELOG.md, cut out by package-release.ps1.
          # The update-*.json files go up with the zips: the programs look for them at .../releases/latest/download/.
          # Not a pre-release, even while the version starts with 0: .../releases/latest skips pre-releases, and the web page links there.
          $assets = (Get-ChildItem artifacts/release/*.zip, artifacts/release/update-*.json).FullName
          gh release create '${{ github.ref_name }}' $assets --title "GameShare $env:VERSION" --notes-file artifacts/release/release-notes.md
